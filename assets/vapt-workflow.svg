<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="255" viewBox="0 0 1280 255" role="img" aria-labelledby="title desc"><title id="title">Vulnerability assessment and penetration testing workflow</title><desc id="desc">Prepare, discover, enumerate, validate, safely demonstrate, report, and reset in the isolated lab.</desc><rect width="1280" height="255" rx="18" fill="#0b1831"/><text x="44" y="49" font-size="29" font-family="Arial,sans-serif" fill="#f5f8ff" font-weight="700">Repeatable VAPT workflow</text><text x="44" y="78" font-size="16" font-family="Arial,sans-serif" fill="#a9bddc">Each candidate progresses through evidence-backed stages</text><rect x="37" y="113" width="157" height="78" rx="13" fill="#1a2c4b" stroke="#47628b"/><text x="115" y="144" fill="#80dacc" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" font-weight="700">01</text><text x="115" y="170" fill="#f0f5ff" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="700">Prepare</text><path d="M198 150 h12 m-6 -6 6 6 -6 6" fill="none" stroke="#73b7e9" stroke-width="2" stroke-linejoin="round"/><rect x="213" y="113" width="157" height="78" rx="13" fill="#1a2c4b" stroke="#47628b"/><text x="291" y="144" fill="#80dacc" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" font-weight="700">02</text><text x="291" y="170" fill="#f0f5ff" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="700">Discover</text><path d="M374 150 h12 m-6 -6 6 6 -6 6" fill="none" stroke="#73b7e9" stroke-width="2" stroke-linejoin="round"/><rect x="389" y="113" width="157" height="78" rx="13" fill="#1a2c4b" stroke="#47628b"/><text x="467" y="144" fill="#80dacc" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" font-weight="700">03</text><text x="467" y="170" fill="#f0f5ff" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="700">Enumerate</text><path d="M550 150 h12 m-6 -6 6 6 -6 6" fill="none" stroke="#73b7e9" stroke-width="2" stroke-linejoin="round"/><rect x="565" y="113" width="157" height="78" rx="13" fill="#234b56" stroke="#65dac1"/><text x="643" y="144" fill="#80dacc" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" font-weight="700">04</text><text x="643" y="170" fill="#f0f5ff" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="700">Validate</text><path d="M726 150 h12 m-6 -6 6 6 -6 6" fill="none" stroke="#73b7e9" stroke-width="2" stroke-linejoin="round"/><rect x="741" y="113" width="157" height="78" rx="13" fill="#1a2c4b" stroke="#47628b"/><text x="819" y="144" fill="#80dacc" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" font-weight="700">05</text><text x="819" y="170" fill="#f0f5ff" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="700">Demonstrate</text><path d="M902 150 h12 m-6 -6 6 6 -6 6" fill="none" stroke="#73b7e9" stroke-width="2" stroke-linejoin="round"/><rect x="917" y="113" width="157" height="78" rx="13" fill="#1a2c4b" stroke="#47628b"/><text x="995" y="144" fill="#80dacc" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" font-weight="700">06</text><text x="995" y="170" fill="#f0f5ff" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="700">Report</text><path d="M1078 150 h12 m-6 -6 6 6 -6 6" fill="none" stroke="#73b7e9" stroke-width="2" stroke-linejoin="round"/><rect x="1093" y="113" width="157" height="78" rx="13" fill="#1a2c4b" stroke="#47628b"/><text x="1171" y="144" fill="#80dacc" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" font-weight="700">07</text><text x="1171" y="170" fill="#f0f5ff" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="700">Reset</text><text x="640" y="229" font-size="15" fill="#adbedc" font-family="Arial,sans-serif" text-anchor="middle">Documentation at every stage • preserve real scan output • no fabricated exploit evidence</text></svg>